<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090909">
  <title>Redscapes Personnel Database</title>
  <meta name="description" content="Authorized Redscapes personnel database.">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <header class="site-header">
    <a class="brand" href="/" aria-label="Redscapes Research Facility home">
      <img src="/assets/redscapes-logo.png" alt="" class="brand-mark">
      <span class="brand-copy">
        <strong>REDSCAPES</strong>
        <small>RESEARCH FACILITY</small>
      </span>
    </a>
    <div class="system-pill" aria-label="System status">
      <span class="status-dot"></span>
      DATABASE ONLINE
    </div>
  </header>

  <main id="app" class="app-shell" aria-live="polite">
    <section class="loading-panel">
      <div class="loading-line"></div>
      <p>Loading personnel database…</p>
    </section>
  </main>

  <footer class="site-footer">
    <span>REDSCAPES // PERSONNEL ARCHIVE</span>
    <span>AUTHORIZED ACCESS ONLY</span>
  </footer>

  <script src="/personnel.js"></script>
  <script src="/app.js" defer></script>
</body>
</html>
